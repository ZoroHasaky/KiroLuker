name: Release

# VERSION 是唯一版本源。main 每次推送都会检查该版本，
# 只有对应 GitHub Release 不存在时才构建 Windows x64 与 macOS arm64。
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 检查版本
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4

      - name: 读取 VERSION 并检查 Release
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "VERSION 不符合语义化版本格式：$version" >&2
            exit 1
          fi

          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "### 跳过发布" >> "$GITHUB_STEP_SUMMARY"
            echo "\`$tag\` 已经存在，本次推送不重复打包。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "### 准备发布 $tag" >> "$GITHUB_STEP_SUMMARY"
            echo "检测到新版本，将构建 macOS arm64 和 Windows x64 安装包。" >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: 构建 ${{ matrix.label }}
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            os: macos-latest
            script: build:mac
            args: --arm64
            artifacts: |
              dist/*-mac-arm64.dmg
              dist/*-mac-arm64.dmg.blockmap
              dist/*-mac-arm64.zip
              dist/*-mac-arm64.zip.blockmap
              dist/latest-mac.yml
          - label: Windows x64
            os: windows-latest
            script: build:win
            args: --x64
            artifacts: |
              dist/*-win-x64-setup.exe
              dist/*-win-x64-setup.exe.blockmap
              dist/latest.yml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 同步 VERSION 到 npm 元数据
        run: npm run sync:version

      - name: 准备构建工具链
        run: python -m pip install --upgrade setuptools

      - name: 安装依赖
        run: npm ci

      - name: 打包
        run: npm run ${{ matrix.script }} -- ${{ matrix.args }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: 发布 ${{ needs.prepare.outputs.tag }}
    needs:
      - prepare
      - build
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 生成发布说明
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          awk -v ver="$VERSION" '
            { line = $0; sub(/\r$/, "", line) }
            index(line, "## [" ver "]") == 1 { flag = 1; next }
            flag && index(line, "## [") == 1 { exit }
            flag && line ~ /^\[.*\]: http/ { next }
            flag && line ~ /^> *安装遇到问题/ { next }
            flag { print line }
          ' CHANGELOG.md > NOTES.md
          if [ ! -s NOTES.md ]; then
            echo "本次发布未在 CHANGELOG.md 中找到 $VERSION 的条目。" > NOTES.md
          fi
          cat >> NOTES.md <<'EOF'

          ## 📦 下载

          | 平台 | 文件 |
          | --- | --- |
          | macOS (Apple Silicon) | `*-mac-arm64.dmg` |
          | Windows | `*-win-x64-setup.exe` |

          macOS 安装包未做签名与公证，首次打开请右键选择「打开」，或在
          「系统设置 - 隐私与安全性」中允许运行。

          ---

          > 安装遇到问题？请查看 [安装说明与常见问题](${{ github.server_url }}/${{ github.repository }}/blob/main/INSTALL.md)。
          EOF

      - name: 创建 GitHub Release 并上传安装包
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: KiroLuker ${{ needs.prepare.outputs.tag }}
          body_path: NOTES.md
          files: artifacts/**
          fail_on_unmatched_files: true
