name: Release

# 推送 v* 标签即三平台并行构建并发布 Release。
# 手动触发（workflow_dispatch）只做构建验证，不创建 Release。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: 构建 ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # 单平台失败不连累其它平台，便于只重跑失败的那个
      fail-fast: false
      matrix:
        include:
          - label: macOS
            os: macos-latest
            script: build:mac
            artifacts: |
              dist/*.dmg
              dist/*.zip
              dist/*.blockmap
              dist/latest-mac.yml
          # Windows 包必须在 windows runner 上打：
          # cbor-extract 没有 win32 预编译产物以外的可用组合，交叉编译会失败
          - label: Windows
            os: windows-latest
            script: build:win
            artifacts: |
              dist/*.exe
              dist/*.blockmap
              dist/latest.yml
          - label: Linux
            os: ubuntu-latest
            script: build:linux
            artifacts: |
              dist/*.AppImage
              dist/latest-linux.yml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # --publish never：产物统一交给下面的 release job 上传，
      # 避免 electron-builder 在 CI 检测到 tag 时自行创建重复的 Release
      - name: 打包
        run: npm run ${{ matrix.script }} -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 生成发布说明
        run: |
          version="${GITHUB_REF_NAME#v}"
          # 只取 CHANGELOG 里当前版本那一段，避免把历史日志全塞进说明
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
            flag && /^## \[/ { exit }
            flag && /^\[.*\]: http/ { next }   # 跳过底部链接定义
            flag { print }
          ' CHANGELOG.md > NOTES.md
          if [ ! -s NOTES.md ]; then
            echo "本次发布未在 CHANGELOG.md 中找到 $version 的条目。" > NOTES.md
          fi
          cat >> NOTES.md <<'EOF'

          ## 📦 下载

          | 平台 | 文件 |
          | --- | --- |
          | macOS (Apple Silicon) | `*-mac-arm64.dmg` |
          | macOS (Intel) | `*-mac-x64.dmg` |
          | Windows | `*-win-x64-setup.exe` |
          | Linux | `*-linux-x86_64.AppImage` |

          macOS 安装包未做签名与公证，首次打开请右键选择「打开」，或在
          「系统设置 - 隐私与安全性」中允许运行。
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: NOTES.md
          files: artifacts/**
          fail_on_unmatched_files: true
